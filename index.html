    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I use an SVG as a CSS background image?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Encode the SVG as a data URI and put it in background-image: url(\"data:image/svg+xml,...\"). This loads with the stylesheet with no extra request and works in contexts where an <img> can't go."
            }
          },
          {
            "@type": "Question",
            "name": "Should I URL-encode or base64 the SVG?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "URL-encoding is usually 20 to 40 percent smaller than base64 for SVG, because it only escapes the few characters a data URI disallows and leaves the markup readable. Use base64 only if a toolchain requires it."
            }
          },
          {
            "@type": "Question",
            "name": "Why use single quotes inside the SVG?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The CSS url() value is wrapped in double quotes, so the SVG's own attribute quotes are switched to single quotes to avoid escaping them. This tool does that automatically."
            }
          },
          {
            "@type": "Question",
            "name": "Is my SVG uploaded anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Encoding runs entirely in your browser and your SVG is stored only in local storage. It works offline once loaded."
            }
          }
        ]
      }
